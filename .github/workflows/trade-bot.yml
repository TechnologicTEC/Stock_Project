name: Trading bot

# Runs each paper-trading strategy after each US close (Sun-Thu UTC) and again
# before each open (the pre-market run, Mon-Fri UTC).
#
# Every strategy trades its OWN $10k Alpaca paper account, so Alpaca computes
# each equity curve directly and no attribution logic of ours sits in between.
# That's also why this is a matrix: one job per strategy, its own keys, its own
# log, and `fail-fast: false` so one strategy erroring leaves the others to trade.
#
# SAFETY. Three things have to line up before an order is placed:
#   1. BOT_TRADING_ENABLED (a repo *variable*) must equal "true". Anything else —
#      unset, empty, "false", a typo — halts the run. Named positively and
#      checked for equality so the accidental state is always the safe one.
#   2. bot_config.enabled must be true and bot_config.killed false, per strategy.
#   3. The Alpaca client's resolved endpoint is asserted to be the paper host
#      before every submission (engine/bot/accounts.assert_paper).
# A halted run exits 0 — a stop working correctly is not a failure, so a red job
# in Actions always means something is genuinely wrong.

on:
  schedule:
    # 21:45 UTC, SUNDAY THROUGH THURSDAY — 15 minutes after warm-cache's 21:30,
    # so the day's prices and fundamentals are already in Supabase and the bot
    # reads a warm cache instead of re-fetching. Shortly after the 4pm ET close
    # (works for EST and EDT). Orders placed after the close queue for the next
    # open, which is the intended behaviour for a daily bot.
    #
    # Sun-Thu, not Mon-Fri, and the day that moved is the one that mattered.
    # Both schedules place five orders a week into the same five sessions —
    # every run fills at the next open, and the Friday and Sunday runs both fill
    # at MONDAY's open, because no session exists in between. What differs is
    # what the run can see when it decides:
    #
    #   Friday 21:45 UTC   fills Mon open, 3 days queued, leaderboard 5 days old
    #   Sunday 21:45 UTC   fills Mon open, 1 day  queued, leaderboard ~6h old
    #
    # The S&P 500 leaderboard is rebuilt weekly at Sunday 13:10 UTC and takes
    # 1.5-3h, so a Sunday-evening run is the first one that can act on it (the
    # S&P 400 one, merged in from Nov 2026, is rebuilt the day before). The
    # old Friday run read a ranking from the PREVIOUS Sunday and was the
    # staleest of the week; now the freshest ranking feeds the run whose orders
    # open the trading week. Friday's closes are not skipped — they are still
    # the newest data on Sunday, so that run acts on exactly what the Friday run
    # would have, with a better ranking and two fewer days in flight.
    #
    # In NZ (UTC+12/13) this reads as weekday mornings, Mon-Fri, instead of
    # Tue-Sat. GitHub starts it late: across 28 Sep-27 Oct it began between
    # 23:34 and 02:50 UTC (2-5 hours late), so ~1-4pm NZ. Warm-cache is just as
    # late and the two used to race; run_bot now waits for warm-cache's
    # "done" marker (run_bot._wait_for_warm_cache) instead of trusting the
    # 15 minutes between their schedules.
    - cron: "45 21 * * 0-4"

    # 04:30 UTC, MONDAY THROUGH FRIDAY — the PRE-MARKET run, NZ evenings.
    #
    # The morning run lands in the NZ afternoon, but creator videos are scanned
    # later than that, so a mention found then waited for the NEXT morning's
    # run, whose order filled at the open after that — two days from video to
    # fill. This run sits between the two: after the scan that picks up the
    # creator's usual ~00:00-02:00 UTC upload, and before the US open.
    #
    # It was 08:30 UTC until 27 Oct 2026, chosen on the belief that runs land
    # ~2h late. They don't: across 28 Sep-27 Oct the 08:30 run began between
    # 13:25 and 18:06 UTC (5-10 hours late), AFTER the 13:30 UTC open on every
    # day but one, so its orders filled mid-session rather than at the open.
    # GitHub's delays here have run 2-10 hours, so 04:30 lands ~06:30-14:30 UTC:
    # before the 14:30 UTC open in EST (from 2 Nov) even at the worst delay seen,
    # and before the 13:30 EDT open on all but the worst. One that does land
    # late fills intraday, which check_fills grades separately.
    #
    # Mon-Fri because each run precedes THAT day's US session. In NZ it is
    # 16:30 NZST / 17:30 NZDT, landing in the evening.
    #
    # It runs with --pre-market (see the `run` step), which trades normally but
    # writes no equity snapshot: no session has closed since the morning run
    # recorded one. Double-buying is already handled — an order from the
    # morning run is still queued at this hour, the PENDING_ORDER rail refuses
    # to stack a second on top of it, and the cash already promised to queued
    # buys is not spent again (executor.committed_to_buys).
    #
    # KEEP IN STEP: the `run` step matches this exact string to detect the
    # pre-market run, app/pages/11_bot.py computes "next scheduled run" from
    # both crons, and tests check all three agree.
    - cron: "30 4 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        # GitHub renders a boolean as a TICKBOX, and the description is its
        # only label — so it has to describe the tick, not the job. The old
        # wording ("Plan and journal, but submit no orders") read as a
        # statement about what the bot does, which is exactly how a run meant
        # to open five accounts came back as a rehearsal that traded nothing.
        # Lead with "DRY RUN" and say plainly what unticking it does.
        description: "DRY RUN — tick to plan only. UNTICK to place real paper orders."
        type: boolean
        required: false
        default: true          # a manual run defaults to SAFE, not to trading
      strategy:
        description: "Run only this strategy (blank = all five)"
        required: false
        default: ""
      pre_market:
        # Same rule as the dry-run box: the description is the tick's only
        # label, so it says what ticking it does and when you would.
        description: "PRE-MARKET — tick if running before the US open (trades, but records no equity snapshot)."
        type: boolean
        required: false
        default: false

concurrency: trade-bot        # never overlap runs

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # up to 40 of it waiting for warm-cache (run_bot._wait_for_warm_cache)
    strategy:
      fail-fast: false        # one strategy's failure must not stop the others
      matrix:
        # Add each strategy here as it lands, in the blueprint's build order.
        # Only names registered in engine/bot/strategies/__init__.py are valid —
        # run_bot.py validates against that registry, so a stale entry fails fast.
        # golden_cross REPLACES spy_harness on the same Alpaca account: the
        # harness was the plumbing test that runs until the real signal is ready,
        # and both hold SPY at one slot, so the handover needs no trade when the
        # cross is on. Running both would have them fight over one account.
        strategy: [golden_cross, composite_rebalance, score_threshold, creator_conviction,
                   top_decile_long]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: bash scripts/retry.sh pip install -r requirements-bot.txt

      - name: Run ${{ matrix.strategy }}
        # Skip this job when a manual run named a different strategy.
        if: ${{ github.event.inputs.strategy == '' || github.event.inputs.strategy == matrix.strategy }}
        env:
          DATABASE_URL: ${{ secrets.WARM_DATABASE_URL }}      # BYPASSRLS role; bot tables are shared
          PRICE_HISTORY_SOURCE: "alpaca"                      # match the app's provider so the warm cache is read
          BOT_TRADING_ENABLED: ${{ vars.BOT_TRADING_ENABLED }}

          # Per-strategy Alpaca paper accounts. bot_config.key_env_prefix picks
          # the pair; every strategy's keys are passed to every job because the
          # matrix can't index secrets by name, and a job only ever reads its own.
          ALPACA_GOLDEN_CROSS_KEY: ${{ secrets.ALPACA_GOLDEN_CROSS_KEY }}
          ALPACA_GOLDEN_CROSS_SECRET: ${{ secrets.ALPACA_GOLDEN_CROSS_SECRET }}
          ALPACA_COMPOSITE_REBALANCE_KEY: ${{ secrets.ALPACA_COMPOSITE_REBALANCE_KEY }}
          ALPACA_COMPOSITE_REBALANCE_SECRET: ${{ secrets.ALPACA_COMPOSITE_REBALANCE_SECRET }}
          ALPACA_SCORE_THRESHOLD_KEY: ${{ secrets.ALPACA_SCORE_THRESHOLD_KEY }}
          ALPACA_SCORE_THRESHOLD_SECRET: ${{ secrets.ALPACA_SCORE_THRESHOLD_SECRET }}
          ALPACA_CREATOR_CONVICTION_KEY: ${{ secrets.ALPACA_CREATOR_CONVICTION_KEY }}
          ALPACA_CREATOR_CONVICTION_SECRET: ${{ secrets.ALPACA_CREATOR_CONVICTION_SECRET }}
          ALPACA_TOP_DECILE_LONG_KEY: ${{ secrets.ALPACA_TOP_DECILE_LONG_KEY }}
          ALPACA_TOP_DECILE_LONG_SECRET: ${{ secrets.ALPACA_TOP_DECILE_LONG_SECRET }}
        # `github.event.schedule` is the cron string that fired, so the
        # pre-market run is identified by its schedule rather than by the time
        # the runner happens to wake up — runs land hours late, so the clock is
        # exactly the wrong thing to infer it from.
        run: |
          python scripts/run_bot.py \
            --strategy ${{ matrix.strategy }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ (github.event.schedule == '30 4 * * 1-5' || github.event.inputs.pre_market == 'true') && '--pre-market' || '' }}
